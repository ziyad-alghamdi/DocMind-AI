name: Prepare cloud deployment

on:
  push:
    branches: [main]
    paths:
      - "scripts/prepare_cloud.py"
      - ".github/workflows/prepare-cloud.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare cloud-ready files
        run: python scripts/prepare_cloud.py

      - name: Commit generated cloud configuration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/main.py backend/requirements.txt frontend/app/page.tsx render.yaml
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Prepare DocMind for cloud deployment"
            git push
          fi
